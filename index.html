<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal Unicode Emoji Kitchen</title>

<style>
body{
background:#0b0b0b;
color:white;
font-family:monospace;
text-align:center;
}

h1{
margin-top:20px;
}

input{
font-size:42px;
width:80px;
text-align:center;
background:#111;
color:white;
border:1px solid #333;
}

button{
padding:10px 20px;
margin:5px;
font-size:16px;
background:#222;
color:white;
border:1px solid #444;
cursor:pointer;
}

button:hover{
background:#333;
}

#combo{
font-size:40px;
margin-top:10px;
}

#art{
white-space:pre;
font-size:12px;
line-height:10px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🍳 Universal Emoji Kitchen</h1>

<div>
<input id="e1" value="😀">
<input id="e2" value="🔥">
</div>

<div>
<button onclick="cook()">Cook</button>
<button onclick="randomEmoji()">Random</button>
<button onclick="download()">Export</button>
</div>

<div id="combo"></div>

<pre id="art"></pre>

<script>

const blocks=[" ","░","▒","▓","█"];

const colors=[
"#ff4d4d",
"#ffaa00",
"#ffee00",
"#00ff9d",
"#00c3ff",
"#c77dff",
"#ff66c4"
];

function hash(str){
let h=0;
for(let i=0;i<str.length;i++){
h=((h<<5)-h)+str.charCodeAt(i);
h|=0;
}
return Math.abs(h);
}

/* Generate random emoji from Unicode ranges */
function randomUnicodeEmoji(){

const ranges=[
[0x1F600,0x1F64F],
[0x1F300,0x1F5FF],
[0x1F680,0x1F6FF],
[0x1F900,0x1F9FF],
[0x1FA70,0x1FAFF],
[0x2600,0x26FF],
[0x2700,0x27BF]
];

let range=ranges[Math.floor(Math.random()*ranges.length)];

let code=Math.floor(
Math.random()*(range[1]-range[0])
)+range[0];

return String.fromCodePoint(code);

}

function randomEmoji(){

document.getElementById("e1").value=randomUnicodeEmoji();
document.getElementById("e2").value=randomUnicodeEmoji();

cook();

}

function cook(){

let e1=document.getElementById("e1").value;
let e2=document.getElementById("e2").value;

document.getElementById("combo").innerText=e1+" + "+e2;

let seed=hash(e1+e2);

let width=60;
let height=30;

let art="";

for(let y=0;y<height;y++){

let row="";

for(let x=0;x<width/2;x++){

seed=(seed*1664525+1013904223)%4294967296;

let r=(seed>>>0)/4294967296;

let d=Math.sqrt((x-width/4)**2+(y-height/2)**2);

let index;

if(d<6)
index=4;
else if(d<8)
index=3;
else if(r>.85)
index=2;
else if(r>.65)
index=1;
else
index=0;

row+=blocks[index];

}

let mirror=row.split("").reverse().join("");

art+=colorize(row+mirror)+"\n";

}

document.getElementById("art").innerHTML=art;

}

function colorize(line){

let out="";

for(let c of line){

if(c===" ")
out+=" ";
else{

let color=colors[Math.floor(Math.random()*colors.length)];

out+='<span style="color:'+color+'">'+c+"</span>";

}

}

return out;

}

function download(){

let text=document.getElementById("art").innerText;

let blob=new Blob([text],{type:"text/plain"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="emoji_unicode_art.txt";

a.click();

}

cook();

</script>

</body>
</html>
