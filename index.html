<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOD MODE Emoji Kitchen</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}
h1 {
  margin-top: 20px;
  font-size: 28px;
}
#picker {
  display: inline-grid;
  grid-template-columns: repeat(auto-fill, 40px);
  gap: 6px;
  max-width: 460px;
  margin: 12px auto;
}
.emoji-btn {
  font-size: 32px;
  cursor: pointer;
  border: 1px solid #333;
  background: #222;
  padding: 4px;
  border-radius: 6px;
}
#result {
  margin-top: 20px;
}
#result img {
  width: 128px;
  height: 128px;
}
button {
  font-size: 16px;
  padding: 8px 16px;
  margin: 8px;
  background: #333;
  color: white;
  border: 1px solid #555;
  cursor: pointer;
}
button:hover {
  background: #444;
}
input {
  font-size: 32px;
  width: 60px;
  text-align: center;
  margin: 6px;
  border: 1px solid #444;
  background: #222;
  color: white;
}
</style>
</head>
<body>

<h1>🔥 GOD MODE Emoji Kitchen</h1>

<div>
  <input id="firstEmoji" placeholder="😀">
  <input id="secondEmoji" placeholder="🔥">
</div>

<div>
  <button onclick="cook()">Mix</button>
  <button onclick="randomEmojis()">Random</button>
  <button onclick="downloadResult()">Download</button>
</div>

<div id="result"></div>

<h2>Emoji Picker</h2>
<div id="picker"></div>

<script>
// Build a large emoji list (common emoji ranges)
const emojiRanges = [
  [0x1F300, 0x1F5FF],
  [0x1F600, 0x1F64F],
  [0x1F680, 0x1F6FF],
  [0x1F700, 0x1F77F],
  [0x1F780, 0x1F7FF],
  [0x1F800, 0x1F8FF],
  [0x1F900, 0x1F9FF]
];

// Flatten into list
let allEmojis = [];
for (let [start, end] of emojiRanges) {
  for (let cp = start; cp <= end; cp++) {
    allEmojis.push(String.fromCodePoint(cp));
  }
}

// Populate emoji grid
const picker = document.getElementById("picker");
allEmojis.forEach(emo => {
  let btn = document.createElement("button");
  btn.textContent = emo;
  btn.className = "emoji-btn";
  btn.onclick = () => selectEmoji(emo);
  picker.appendChild(btn);
});

function selectEmoji(emo) {
  if (!document.getElementById("firstEmoji").value) {
    document.getElementById("firstEmoji").value = emo;
  } else {
    document.getElementById("secondEmoji").value = emo;
  }
}

function randomEmojis() {
  document.getElementById("firstEmoji").value = allEmojis[Math.floor(Math.random() * allEmojis.length)];
  document.getElementById("secondEmoji").value = allEmojis[Math.floor(Math.random() * allEmojis.length)];
  cook();
}

function cook() {
  const e1 = document.getElementById("firstEmoji").value;
  const e2 = document.getElementById("secondEmoji").value;
  document.getElementById("result").innerHTML =
    `<h2>${e1} + ${e2}</h2>`;

  // Build URL pattern for hosted Emoji Kitchen sticker
  const code1 = Array.from(e1).map(c => c.codePointAt(0).toString(16)).join("-");
  const code2 = Array.from(e2).map(c => c.codePointAt(0).toString(16)).join("-");
  
  // Many community sites use the same pattern for hosted art:
  const url = `https://emojikitchen.com/kitchen/${code1}/${code1}_${code2}.png`;

  const img = new Image();
  img.src = url;
  img.onerror = () => {
    document.getElementById("result").innerHTML +=
      "<p style='color: #f55'>No mashup found!</p>";
  };
  img.onload = () => {
    document.getElementById("result").appendChild(img);
  };
}

function downloadResult() {
  const img = document.querySelector("#result img");
  if (!img) return;
  const a = document.createElement("a");
  a.href = img.src;
  a.download = "emoji_kitchen.png";
  a.click();
}
</script>

</body>
</html>
